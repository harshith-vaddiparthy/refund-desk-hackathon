name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check assessment guards without model or payment calls
        run: python -m unittest discover -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint the dashboard
        working-directory: frontend
        run: npm run lint
      - name: Test frontend money and API behavior
        working-directory: frontend
        run: npm test
      - name: Type-check and build the dashboard
        working-directory: frontend
        run: npm run build
